<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NGO Portal - Food Rescue Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 40px; }
        .card { border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
<div class="container" style="max-width: 500px;">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-primary">NGO Portal</h2>
        <p class="text-muted">Sign in or register your organization to claim surplus food.</p>
    </div>

    <!-- Login Card -->
    <div class="card p-4 mb-4">
        <h4 class="mb-3">NGO Login</h4>
        <form onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label class="form-label">NGO ID</label>
                <input type="text" id="loginId" class="form-control" placeholder="e.g. U101" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="********" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Login to Marketplace</button>
        </form>
    </div>

    <!-- Registration Card -->
    <div class="card p-4">
        <h4 class="mb-3">Register New NGO Account</h4>
        <form onsubmit="handleRegister(event)">
            <div class="mb-3">
                <label class="form-label">NGO ID</label>
                <input type="text" id="regId" class="form-control" placeholder="e.g. U103" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Organization Name</label>
                <input type="text" id="regName" class="form-control" placeholder="e.g. Helping Hands Foundation" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" id="regPhone" class="form-control" placeholder="9988776655" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Location / Address (For Distance Matching)</label>
                <input type="text" id="regLocation" class="form-control" placeholder="Bhimavaram" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="regPassword" class="form-control" placeholder="********" required>
            </div>
            <button type="submit" class="btn btn-outline-primary w-100 fw-bold">Register Account</button>
        </form>
    </div>
    
    <div class="text-center mt-3">
        <a href="index.html" class="text-muted text-decoration-none">← Back to Portal Selection</a>
    </div>
</div>

<script>
    async function handleLogin(e) {
        e.preventDefault();
        const id = document.getElementById('loginId').value;
        const password = document.getElementById('loginPassword').value;

        const formData = new URLSearchParams();
        formData.append('id', id);
        formData.append('password', password);

        const res = await fetch('/api/login', { method: 'POST', body: formData });
        const result = await res.text();

        if (result === 'SUCCESS') {
            window.location.href = `ngo-dashboard.html?id=${id}`;
        } else {
            alert(result);
        }
    }

    async function handleRegister(e) {
        e.preventDefault();
        const formData = new URLSearchParams();
        formData.append('id', document.getElementById('regId').value);
        formData.append('name', document.getElementById('regName').value);
        formData.append('phone', document.getElementById('regPhone').value);
        formData.append('location', document.getElementById('regLocation').value);
        formData.append('password', document.getElementById('regPassword').value);

        const res = await fetch('/api/register', { method: 'POST', body: formData });
        alert(await res.text());
        if (res.ok) {
            window.location.href = `ngo-dashboard.html?id=${document.getElementById('regId').value}`;
        }
    }
</script>
</body>
</html>
